<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>管理端登录 · 动态人脸识别安全认证系统</title>
<link rel="stylesheet" href="css/style.css" />
<style>
  .al-shell{width:min(440px,100%);margin:0 auto;padding:6px 18px 44px}
  .al-card{background:var(--card);border-radius:18px;box-shadow:var(--shadow-md);padding:28px 32px 30px;margin-top:8px}
  .al-card h2{font-size:20px;color:var(--navy-900)}
  .al-sub{font-size:13px;color:var(--muted);margin:8px 0 20px;line-height:1.8}
</style>
</head>
<body>
<div class="page-bg" aria-hidden="true"><div class="bg-grid"></div></div>

<header class="topbar">
  <div class="brand-mini">
    <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4 40 10v12c0 10-6.5 17.5-16 22C14.5 39.5 8 32 8 22V10Z" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="24" cy="21" r="6.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 32c1.8-3.6 5-5.4 9-5.4s7.2 1.8 9 5.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span class="brand-name">动态人脸识别安全认证系统 <em>· 管理端</em></span>
  </div>
  <div class="topbar-right"><a class="mode-badge" href="index.html" style="text-decoration:none">← 返回入口</a></div>
</header>

<main class="shell">
  <section class="al-shell">
    <div class="al-card">
      <h2>管理员登录 / 注册</h2>
      <p class="al-sub">管理端仅需账号和密码，无需人脸录入。</p>

      <div class="tab-bar" role="tablist">
        <button class="tab active" type="button" data-al-tab="login">登录</button>
        <button class="tab" type="button" data-al-tab="register">注册</button>
      </div>

      <form id="al-form-login" class="auth-form" novalidate>
        <div class="field">
          <label for="al-login-username">账号</label>
          <input id="al-login-username" type="text" placeholder="请输入管理员账号" spellcheck="false" autocomplete="username" />
        </div>
        <div class="field">
          <label for="al-login-password">密码</label>
          <input id="al-login-password" type="password" placeholder="请输入密码" autocomplete="current-password" />
        </div>
        <p class="err" id="al-login-error" role="alert"></p>
        <button type="submit" class="btn primary block">登 录</button>
      </form>

      <form id="al-form-register" class="auth-form" hidden novalidate>
      <input id="al-reg-key" type="text" placeholder="邀请密钥(首位管理员可留空)" />
        <div class="field">
          <label for="al-reg-username">账号</label>
          <input id="al-reg-username" type="text" placeholder="4-20 位字母/数字/下划线" spellcheck="false" autocomplete="username" />
        </div>
        <div class="field">
          <label for="al-reg-password">密码</label>
          <input id="al-reg-password" type="password" placeholder="至少 8 位" autocomplete="new-password" />
        </div>
        <p class="err" id="al-reg-error" role="alert"></p>
        <button type="submit" class="btn primary block">注 册</button>
      </form>
    </div>
  </section>
</main>

<script type="module" src="js/admin-login.js"></script>
</body>
</html>
