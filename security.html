<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>安全告警中心 · 动态人脸识别认证系统</title>
<link rel="stylesheet" href="css/style.css" />
<style>
  .sec-shell{width:min(1180px,100%);margin:0 auto;padding:6px 18px 44px}
  .sec-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0 16px}
  .sec-top h2{font-size:21px;color:var(--navy-900)}
  .mode-strip{display:inline-flex;align-items:center;gap:8px;font-size:12px;padding:6px 14px;
    border-radius:999px;background:var(--bg-soft);border:1px solid var(--line);color:var(--muted)}
  .mode-strip i{width:8px;height:8px;border-radius:50%;background:#8b97ab;display:inline-block}
  .mode-strip.on i{background:var(--ok);box-shadow:0 0 8px rgba(39,176,109,.7)}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow-md)}
  .card .k{font-size:12px;color:var(--muted)}
  .card .v{font-size:26px;font-weight:800;color:var(--navy-800);margin-top:2px}
  .card .v.danger{color:var(--danger)}
  .card .v.warn{color:#d68910}
  .card .v.ok{color:var(--ok)}
  .table-wrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto;box-shadow:var(--shadow-md)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
  th{background:var(--bg-soft);color:var(--muted);font-weight:600;position:sticky;top:0}
  td{color:var(--ink)}
  td.det{white-space:normal;max-width:340px;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:#526}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700}
  .pill.reject,.pill.liveness_fail,.pill.spoof_suspect{background:var(--danger-bg);color:var(--danger)}
  .pill.allow,.pill.verify_pass,.pill.enroll_pass{background:var(--ok-bg);color:var(--ok)}
  .pill.watch{background:#fdf1e0;color:#d68910}
  .pill.verify_reject{background:#fdecec;color:#c0392b}
  .empty{color:var(--faint);text-align:center;padding:30px}
  .btn-row{display:flex;gap:10px;align-items:center}
</style>
</head>
<body>
<div class="page-bg" aria-hidden="true"><div class="bg-grid"></div></div>

<header class="topbar">
  <div class="brand-mini">
    <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4 40 10v12c0 10-6.5 17.5-16 22C14.5 39.5 8 32 8 22V10Z" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="24" cy="21" r="6.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 32c1.8-3.6 5-5.4 9-5.4s7.2 1.8 9 5.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span class="brand-name">安全告警中心 <em>· 需求7 攻击告警</em></span>
  </div>
  <div class="topbar-right"><a class="mode-badge" href="index.html" style="text-decoration:none">← 返回登录</a></div>
</header>

<main class="shell">
  <section class="sec-shell">
    <div class="sec-top">
      <h2>告警与审计记录</h2>
      <div class="mode-strip" id="sec-mode"><i></i><span>连接检测中…</span></div>
      <div class="btn-row" style="margin-left:auto">
        <button type="button" class="btn ghost" id="btn-refresh">刷新</button>
        <button type="button" class="btn primary" id="btn-export">
          <span class="btn-label">导出 JSON</span><span class="spinner" hidden></span>
        </button>
      </div>
    </div>

    <div class="cards" id="sec-cards"></div>

    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>时间</th><th>事件</th><th>用户</th><th>判定</th><th>score</th><th>challenge</th><th>软信号/spoof hints</th><th>详情</th>
        </tr></thead>
        <tbody id="sec-body"><tr><td colspan="8" class="empty">加载中…</td></tr></tbody>
      </table>
    </div>
  </section>
</main>

<script type="module" src="js/security.js"></script>
</body>
</html>
